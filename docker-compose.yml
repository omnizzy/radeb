services:
  postgres:
    container_name: radeb_pg_sql
    image: postgres
    environment:
      POSTGRES_USER: nathan
      POSTGRES_PASSWORD: nathan
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5452:5452
    networks:
      - microservices-net
    restart: unless-stopped

  pgadmin:
    container_name: radeb_pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - 5050:80
    networks:
      - microservices-net
    restart: unless-stopped

  mongodb:
    container_name: radeb_mongo_db
    image: mongo
    ports:
      - 27017:27017
    volumes:
      - mongo:/data
    environment:
      MONGO_INITDB_ROOT_USERNAME: nathan
      MONGO_INITDB_ROOT_PASSWORD: nathan

  mongo-express:
    container_name: radeb_mongo_express
    image: mongo-express
    restart: unless-stopped
    ports:
      - 8081:8081
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=nathan
      - ME_CONFIG_MONGODB_ADMINPASSWORD=nathan
      - ME_CONFIG_MONGODB_SERVER=mongodb

  mail-dev:
    container_name: radeb_mail_dev
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025


networks:
  microservices-net:
    driver: bridge

volumes:
  postgres:
  pgadmin:
  mongo: